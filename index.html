<!DOCTYPE html>
<html>
 <head> 
 <title>A-Frame Primitives</title> 
<script src= "https://aframe.io/releases/1.7.0/aframe.min.js"> </script>
</head>
<body> 
    <a-scene> 
        <a-box
        color="red and black"
        position="-5 5 -8"
        rotation="0 45 0"
        width="2"
        height="2"
        depth="2">
        <a-cone
        color="yellow"
        position="-5 0 -8"
        rotation="-45 0 0"
        radius-bottom="0.75"
        height="3">
        <a-text
        value="yurrrrrrr" 
        color="orange"
        position="3 0 -8"
        width="350">
        <a-sky
        color="lightskyblue">
        <a-sphere
        color="green"
        position="0 5 -8"
        radius="1.5">
    </a-sphere>
    <a-cylinder
    color="blue"
    position="5 5 -8"
    rotation="45 0 0"
    radius="1"
    height="3">
</a-cylinder>

        </a-sky>
    </a-text>
    </a-cone>
    </a-box> 
        </a-scene>
    </body>
    </html>
